<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slacken</title>
<meta name="description" content="Slacken — an iOS puzzle game about untangling graphs. Drag the nodes until no lines cross.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfd;
    --ink: #1d1d20;
    --muted: #5d5d66;
    --rule: #e3e3ea;
    --accent: #2f5fd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131317;
      --ink: #ececef;
      --muted: #a2a2ad;
      --rule: #2e2e37;
      --accent: #8aa9f2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 20px 60px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { max-width: 560px; width: 100%; text-align: center; }
  svg { width: 132px; height: 132px; margin-bottom: 24px; }
  .edge { stroke: var(--accent); stroke-width: 2.5; opacity: 0.55; }
  .node { fill: var(--accent); }
  h1 { font-size: 2.4rem; margin: 0 0 10px; letter-spacing: -0.03em; }
  .tagline { color: var(--muted); font-size: 1.06rem; margin: 0 0 36px; }
  nav { border-top: 1px solid var(--rule); padding-top: 22px; }
  nav a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    margin: 0 10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- A small untangled planar graph: the game's win state. -->
  <svg viewBox="0 0 120 120" role="img" aria-label="An untangled graph of six nodes">
    <g class="edge" fill="none">
      <path d="M60 16 L102 40 L102 84 L60 106 L18 84 L18 40 Z"/>
      <path d="M60 16 L60 61"/>
      <path d="M102 84 L60 61"/>
      <path d="M18 84 L60 61"/>
    </g>
    <g class="node">
      <circle cx="60" cy="16" r="6.5"/>
      <circle cx="102" cy="40" r="6.5"/>
      <circle cx="102" cy="84" r="6.5"/>
      <circle cx="60" cy="106" r="6.5"/>
      <circle cx="18" cy="84" r="6.5"/>
      <circle cx="18" cy="40" r="6.5"/>
      <circle cx="60" cy="61" r="6.5"/>
    </g>
  </svg>

  <h1>Slacken</h1>
  <p class="tagline">
    An iOS puzzle game about untangling graphs.<br>
    Drag the nodes until no lines cross.
  </p>

  <nav>
    <a href="./privacy/">Privacy Policy</a>
  </nav>

</div>
</body>
</html>
